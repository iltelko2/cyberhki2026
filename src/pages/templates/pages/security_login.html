<!DOCTYPE html>
<html>
    <head>
        <title>Login Demo</title>
    </head>
    <body>
        <h1>Login Demo</h1>
        <form method="post">
            {% csrf_token %}
            <p>Username: <input type="text" name="username" /></p>
            <p>Password: <input type="password" name="password" /></p>
            <button type="submit">Log in</button>
        </form>
    </body>
</html>
